      <text x="550" y="312" text-anchor="middle" font-weight="600">Paraíso</text>
      <text x="650" y="276" text-anchor="middle" font-weight="600">Ana Rosa</text>
      <text x="750" y="312" text-anchor="middle">Vila Mariana</text>

      <text x="70" y="366" text-anchor="middle">Ana Rosa</text>
      <text x="150" y="402" text-anchor="middle">Paraíso</text>
      <text x="250" y="366" text-anchor="middle">Vergueiro</text>
      <text x="350" y="402" text-anchor="middle">Estação</text>
      <text x="450" y="366" text-anchor="middle">Sé</text>
