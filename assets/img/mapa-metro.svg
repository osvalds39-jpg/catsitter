    <text x="40" y="68" font-size="13" fill="#6B6B6B">Esquema ilustrativo das linhas e estações — não representa a geografia exata.</text>

    <!-- Linhas -->
    <g stroke-linecap="round" fill="none" stroke-width="7">
      <path d="M70 110 H760" stroke="#1F6FEB"/>
      <path d="M70 200 H760" stroke="#F0B429"/>
      <path d="M70 290 H760" stroke="#8E5BBE"/>
      <path d="M70 380 H760" stroke="#D5303C"/>
      <path d="M70 470 H760" stroke="#E2683C"/>
    </g>

    <!-- Conexões verticais -->
