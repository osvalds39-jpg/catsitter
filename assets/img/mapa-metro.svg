      <text x="250" y="456" text-anchor="middle">Santa Cecília</text>
      <text x="350" y="492" text-anchor="middle">República</text>
      <text x="450" y="456" text-anchor="middle">Sé</text>
      <text x="550" y="492" text-anchor="middle">Ana Rosa</text>
      <text x="650" y="456" text-anchor="middle" font-weight="600">Ana Rosa</text>
      <text x="750" y="492" text-anchor="middle" font-weight="600">Vila Prudente</text>
