      <circle cx="150" cy="110" r="7" stroke="#1F6FEB"/>
      <circle cx="250" cy="110" r="7" stroke="#1F6FEB"/>
      <circle cx="350" cy="110" r="7" stroke="#1F6FEB"/>
      <circle cx="450" cy="110" r="7" stroke="#1F6FEB"/>
      <circle cx="550" cy="110" r="7" stroke="#1F6FEB"/>
      <circle cx="650" cy="110" r="7" stroke="#1F6FEB"/>
      <circle cx="750" cy="110" r="7" stroke="#1F6FEB"/>
      <!-- Linha 4 -->
