      <circle cx="550" cy="200" r="7" stroke="#F0B429"/>
      <circle cx="650" cy="200" r="7" stroke="#F0B429"/>
      <circle cx="750" cy="200" r="7" stroke="#F0B429"/>
      <!-- Linha 5 -->
