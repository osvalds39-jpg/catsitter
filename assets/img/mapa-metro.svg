<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" role="img" aria-labelledby="mapa-title mapa-desc">
  <title id="mapa-title">Esquema das principais linhas de metrô atendidas</title>
  <desc id="mapa-desc">Diagrama esquemático com as linhas 1, 2, 3, 4 e 5 do metrô de São Paulo e as estações onde o serviço é priorizado.</desc>

  <rect width="820" height="570" rx="24" fill="#FFFFFF"/>

